openapi: 3.0.3
info:
  title: 'Ticket Management API Documentation'
  description: 'A versioned JSON:API style REST API for raising, assigning, filtering and resolving support tickets, secured with JWT and token abilities.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Authentication
    description: "\nRegister, log in, read the current user, refresh and log out. Tokens are JWTs: send them as\n`Authorization: Bearer {token}` on every other request."
  -
    name: Authors
    description: "\nRead-only view of the users who have raised tickets."
  -
    name: Tickets
    description: "\nCreate, read, update and delete support tickets. Regular users act on the tickets they\nraised; managers act on any ticket and are the only ones who can assign tickets."
  -
    name: 'User Tickets'
    description: "\nThe tickets raised by one user: /api/v1/users/{user}/tickets. A ticket that does not\nbelong to the user in the URL returns 404. The same permissions apply as on /tickets."
  -
    name: Users
    description: "\nUser management. Any logged-in user can list and view users; only managers can create,\nreplace, update and delete them."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Log in with <code>POST /api/v1/auth/login</code> and paste the <code>access_token</code> here. Tokens are JWTs that carry your abilities and expire after the configured <code>JWT_TTL</code> (60 minutes by default).'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: Register
      operationId: register
      description: 'Creates the account and logs the user in immediately.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                    token_type: bearer
                    expires_in: 3600
                  message: 'Registered successfully'
                  status: 200
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: integer
                        example: 3600
                  message:
                    type: string
                    example: 'Registered successfully'
                  status:
                    type: integer
                    example: 200
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Your full name. Must not be greater than 255 characters.'
                  example: 'Jane Doe'
                email:
                  type: string
                  description: 'Your email address. It must not be registered yet. Must be a valid email address. Must not be greater than 255 characters.'
                  example: jane@example.com
                password:
                  type: string
                  description: 'At least 8 characters. Must be at least 8 characters.'
                  example: password
              required:
                - name
                - email
                - password
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Log in'
      operationId: logIn
      description: 'Returns an access token. Send it as a Bearer token on every other request.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                    token_type: bearer
                    expires_in: 3600
                  message: 'Login successful'
                  status: 200
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: integer
                        example: 3600
                  message:
                    type: string
                    example: 'Login successful'
                  status:
                    type: integer
                    example: 200
        401:
          description: 'Wrong email or password'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid credentials'
                  status: 401
                properties:
                  message:
                    type: string
                    example: 'Invalid credentials'
                  status:
                    type: integer
                    example: 401
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Your email address. Must be a valid email address.'
                  example: manager@manager.com
                password:
                  type: string
                  description: 'Your password.'
                  example: password
              required:
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Log out'
      operationId: logOut
      description: 'Blacklists the current token so it can never be used again.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: null
                  message: 'Successfully logged out'
                  status: 200
                properties:
                  data:
                    type: string
                    example: null
                    nullable: true
                  message:
                    type: string
                    example: 'Successfully logged out'
                  status:
                    type: integer
                    example: 200
      tags:
        - Authentication
  /api/v1/auth/me:
    get:
      summary: 'Current user'
      operationId: currentUser
      description: 'Returns the user that owns the Bearer token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 11
                    name: 'The Manager'
                    email: manager@manager.com
                    email_verified_at: '2026-11-23T14:53:00.000000Z'
                    is_manager: true
                    created_at: '2026-11-23T14:53:00.000000Z'
                    updated_at: '2026-11-23T14:53:00.000000Z'
                  message: 'User retrieved'
                  status: 200
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 11
                      name:
                        type: string
                        example: 'The Manager'
                      email:
                        type: string
                        example: manager@manager.com
                      email_verified_at:
                        type: string
                        example: '2026-11-23T14:53:00.000000Z'
                      is_manager:
                        type: boolean
                        example: true
                      created_at:
                        type: string
                        example: '2026-11-23T14:53:00.000000Z'
                      updated_at:
                        type: string
                        example: '2026-11-23T14:53:00.000000Z'
                  message:
                    type: string
                    example: 'User retrieved'
                  status:
                    type: integer
                    example: 200
      tags:
        - Authentication
  /api/v1/auth/refresh:
    post:
      summary: 'Refresh the token'
      operationId: refreshTheToken
      description: 'Blacklists the current token and returns a brand-new one.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                    token_type: bearer
                    expires_in: 3600
                  message: 'Token refreshed'
                  status: 200
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: integer
                        example: 3600
                  message:
                    type: string
                    example: 'Token refreshed'
                  status:
                    type: integer
                    example: 200
      tags:
        - Authentication
  /api/v1/authors:
    get:
      summary: 'List authors'
      operationId: listAuthors
      description: 'Lists only users who raised at least one ticket, 15 per page.'
      parameters:
        -
          in: query
          name: id
          description: 'Filter by one or several ids.'
          example: '1,2'
          required: false
          schema:
            type: string
            description: 'Filter by one or several ids.'
            example: '1,2'
        -
          in: query
          name: name
          description: 'Filter by name. Use * as a wildcard.'
          example: '*john*'
          required: false
          schema:
            type: string
            description: 'Filter by name. Use * as a wildcard.'
            example: '*john*'
        -
          in: query
          name: email
          description: 'Filter by email. Use * as a wildcard.'
          example: '*@example.com'
          required: false
          schema:
            type: string
            description: 'Filter by email. Use * as a wildcard.'
            example: '*@example.com'
        -
          in: query
          name: createdAt
          description: 'A date, or a range as from,to.'
          example: '2026-01-01,2026-12-31'
          required: false
          schema:
            type: string
            description: 'A date, or a range as from,to.'
            example: '2026-01-01,2026-12-31'
        -
          in: query
          name: sort
          description: 'Sort by name, email, createdAt or updatedAt. Prefix with - for descending.'
          example: name
          required: false
          schema:
            type: string
            description: 'Sort by name, email, createdAt or updatedAt. Prefix with - for descending.'
            example: name
        -
          in: query
          name: include
          description: 'Include the tickets each author raised.'
          example: tickets
          required: false
          schema:
            type: string
            description: 'Include the tickets each author raised.'
            example: tickets
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      type: user
                      id: 98
                      attributes:
                        name: 'Morgan Hirthe'
                        email: dare.emelie@example.com
                        isManager: false
                        emailVerifiedAt: '2026-11-23T15:10:18.000000Z'
                        createdAt: '2026-11-23T15:10:18.000000Z'
                        updatedAt: '2026-11-23T15:10:18.000000Z'
                      links:
                        self: 'http://localhost:8000/api/v1/authors/98'
                    -
                      type: user
                      id: 99
                      attributes:
                        name: 'Prof. Mina Bauch'
                        email: okeefe.isidro@example.org
                        isManager: false
                        emailVerifiedAt: '2026-11-23T15:10:18.000000Z'
                        createdAt: '2026-11-23T15:10:18.000000Z'
                        updatedAt: '2026-11-23T15:10:18.000000Z'
                      links:
                        self: 'http://localhost:8000/api/v1/authors/99'
                  links:
                    first: '/?page=1'
                    last: '/?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
                    links:
                      -
                        url: null
                        label: '&laquo; Previous'
                        page: null
                        active: false
                      -
                        url: '/?page=1'
                        label: '1'
                        page: 1
                        active: true
                      -
                        url: null
                        label: 'Next &raquo;'
                        page: null
                        active: false
                    path: /
                    per_page: 15
                    to: 2
                    total: 2
                properties:
                  data:
                    type: array
                    example:
                      -
                        type: user
                        id: 98
                        attributes:
                          name: 'Morgan Hirthe'
                          email: dare.emelie@example.com
                          isManager: false
                          emailVerifiedAt: '2026-11-23T15:10:18.000000Z'
                          createdAt: '2026-11-23T15:10:18.000000Z'
                          updatedAt: '2026-11-23T15:10:18.000000Z'
                        links:
                          self: 'http://localhost:8000/api/v1/authors/98'
                      -
                        type: user
                        id: 99
                        attributes:
                          name: 'Prof. Mina Bauch'
                          email: okeefe.isidro@example.org
                          isManager: false
                          emailVerifiedAt: '2026-11-23T15:10:18.000000Z'
                          createdAt: '2026-11-23T15:10:18.000000Z'
                          updatedAt: '2026-11-23T15:10:18.000000Z'
                        links:
                          self: 'http://localhost:8000/api/v1/authors/99'
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: user
                        id:
                          type: integer
                          example: 98
                        attributes:
                          type: object
                          properties:
                            name:
                              type: string
                              example: 'Morgan Hirthe'
                            email:
                              type: string
                              example: dare.emelie@example.com
                            isManager:
                              type: boolean
                              example: false
                            emailVerifiedAt:
                              type: string
                              example: '2026-11-23T15:10:18.000000Z'
                            createdAt:
                              type: string
                              example: '2026-11-23T15:10:18.000000Z'
                            updatedAt:
                              type: string
                              example: '2026-11-23T15:10:18.000000Z'
                        links:
                          type: object
                          properties:
                            self:
                              type: string
                              example: 'http://localhost:8000/api/v1/authors/98'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: '/?page=1'
                      last:
                        type: string
                        example: '/?page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      links:
                        type: array
                        example:
                          -
                            url: null
                            label: '&laquo; Previous'
                            page: null
                            active: false
                          -
                            url: '/?page=1'
                            label: '1'
                            page: 1
                            active: true
                          -
                            url: null
                            label: 'Next &raquo;'
                            page: null
                            active: false
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: null
                              nullable: true
                            label:
                              type: string
                              example: '&laquo; Previous'
                            page:
                              type: string
                              example: null
                              nullable: true
                            active:
                              type: boolean
                              example: false
                      path:
                        type: string
                        example: /
                      per_page:
                        type: integer
                        example: 15
                      to:
                        type: integer
                        example: 2
                      total:
                        type: integer
                        example: 2
      tags:
        - Authors
  '/api/v1/authors/{id}':
    get:
      summary: 'Show an author'
      operationId: showAnAuthor
      description: ''
      parameters:
        -
          in: query
          name: include
          description: 'Include the tickets this author raised.'
          example: tickets
          required: false
          schema:
            type: string
            description: 'Include the tickets this author raised.'
            example: tickets
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    type: user
                    id: 100
                    attributes:
                      name: 'Morgan Hirthe'
                      email: imclaughlin@example.org
                      isManager: false
                      emailVerifiedAt: '2026-11-23T15:10:18.000000Z'
                      createdAt: '2026-11-23T15:10:18.000000Z'
                      updatedAt: '2026-11-23T15:10:18.000000Z'
                    links:
                      self: 'http://localhost:8000/api/v1/authors/100'
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        example: user
                      id:
                        type: integer
                        example: 100
                      attributes:
                        type: object
                        properties:
                          name:
                            type: string
                            example: 'Morgan Hirthe'
                          email:
                            type: string
                            example: imclaughlin@example.org
                          isManager:
                            type: boolean
                            example: false
                          emailVerifiedAt:
                            type: string
                            example: '2026-11-23T15:10:18.000000Z'
                          createdAt:
                            type: string
                            example: '2026-11-23T15:10:18.000000Z'
                          updatedAt:
                            type: string
                            example: '2026-11-23T15:10:18.000000Z'
                      links:
                        type: object
                        properties:
                          self:
                            type: string
                            example: 'http://localhost:8000/api/v1/authors/100'
      tags:
        - Authors
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the author.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: author
        description: 'The user id.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/tickets:
    get:
      summary: 'List tickets'
      operationId: listTickets
      description: "Returns a paginated list of tickets (15 per page, without descriptions). Supports filtering,\nsearching, sorting and including the author and assignee."
      parameters:
        -
          in: query
          name: status
          description: 'Filter by status. Use a comma for several.'
          example: 'open,in_progress'
          required: false
          schema:
            type: string
            description: 'Filter by status. Use a comma for several.'
            example: 'open,in_progress'
        -
          in: query
          name: priority
          description: 'Filter by priority. Use a comma for several.'
          example: 'high,urgent'
          required: false
          schema:
            type: string
            description: 'Filter by priority. Use a comma for several.'
            example: 'high,urgent'
        -
          in: query
          name: search
          description: 'Search the ticket number and the title.'
          example: printer
          required: false
          schema:
            type: string
            description: 'Search the ticket number and the title.'
            example: printer
        -
          in: query
          name: title
          description: 'Filter by title. Use * as a wildcard.'
          example: '*printer*'
          required: false
          schema:
            type: string
            description: 'Filter by title. Use * as a wildcard.'
            example: '*printer*'
        -
          in: query
          name: ticketNumber
          description: 'Filter by ticket number. Use * as a wildcard.'
          example: 'TCK-2026*'
          required: false
          schema:
            type: string
            description: 'Filter by ticket number. Use * as a wildcard.'
            example: 'TCK-2026*'
        -
          in: query
          name: createdBy
          description: 'Tickets raised by these user ids.'
          example: '1'
          required: false
          schema:
            type: string
            description: 'Tickets raised by these user ids.'
            example: '1'
        -
          in: query
          name: assignedTo
          description: 'Tickets assigned to these user ids.'
          example: '2'
          required: false
          schema:
            type: string
            description: 'Tickets assigned to these user ids.'
            example: '2'
        -
          in: query
          name: createdAt
          description: 'A date, or a range as from,to.'
          example: '2026-01-01,2026-12-31'
          required: false
          schema:
            type: string
            description: 'A date, or a range as from,to.'
            example: '2026-01-01,2026-12-31'
        -
          in: query
          name: updatedAt
          description: 'A date, or a range as from,to.'
          example: '2026-11-23'
          required: false
          schema:
            type: string
            description: 'A date, or a range as from,to.'
            example: '2026-11-23'
        -
          in: query
          name: sort
          description: 'Sort by ticketNumber, title, status, priority, createdAt or updatedAt. Prefix with - for descending.'
          example: '-priority,createdAt'
          required: false
          schema:
            type: string
            description: 'Sort by ticketNumber, title, status, priority, createdAt or updatedAt. Prefix with - for descending.'
            example: '-priority,createdAt'
        -
          in: query
          name: include
          description: 'Include related users: author, assignee.'
          example: author
          required: false
          schema:
            type: string
            description: 'Include related users: author, assignee.'
            example: author
        -
          in: query
          name: page
          description: 'The page number.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'The page number.'
            example: 1
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      type: ticket
                      id: 145
                      attributes:
                        ticketNumber: TCK-20261123-EIW6VH
                        title: 'Adipisci quidem nostrum qui commodi.'
                        status: resolved
                        priority: high
                        createdAt: '2026-11-23T15:10:18.000000Z'
                        updatedAt: '2026-11-23T15:10:18.000000Z'
                      relationships:
                        author:
                          data:
                            type: user
                            id: 92
                          links:
                            self: 'http://localhost:8000/api/v1/authors/92'
                        assignee:
                          data: null
                      links:
                        self: 'http://localhost:8000/api/v1/tickets/145'
                    -
                      type: ticket
                      id: 146
                      attributes:
                        ticketNumber: TCK-20261123-NNFBNN
                        title: 'Dignissimos neque blanditiis.'
                        status: closed
                        priority: low
                        createdAt: '2026-11-23T15:10:18.000000Z'
                        updatedAt: '2026-11-23T15:10:18.000000Z'
                      relationships:
                        author:
                          data:
                            type: user
                            id: 93
                          links:
                            self: 'http://localhost:8000/api/v1/authors/93'
                        assignee:
                          data: null
                      links:
                        self: 'http://localhost:8000/api/v1/tickets/146'
                  links:
                    first: '/?page=1'
                    last: '/?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
                    links:
                      -
                        url: null
                        label: '&laquo; Previous'
                        page: null
                        active: false
                      -
                        url: '/?page=1'
                        label: '1'
                        page: 1
                        active: true
                      -
                        url: null
                        label: 'Next &raquo;'
                        page: null
                        active: false
                    path: /
                    per_page: 15
                    to: 2
                    total: 2
                properties:
                  data:
                    type: array
                    example:
                      -
                        type: ticket
                        id: 145
                        attributes:
                          ticketNumber: TCK-20261123-EIW6VH
                          title: 'Adipisci quidem nostrum qui commodi.'
                          status: resolved
                          priority: high
                          createdAt: '2026-11-23T15:10:18.000000Z'
                          updatedAt: '2026-11-23T15:10:18.000000Z'
                        relationships:
                          author:
                            data:
                              type: user
                              id: 92
                            links:
                              self: 'http://localhost:8000/api/v1/authors/92'
                          assignee:
                            data: null
                        links:
                          self: 'http://localhost:8000/api/v1/tickets/145'
                      -
                        type: ticket
                        id: 146
                        attributes:
                          ticketNumber: TCK-20261123-NNFBNN
                          title: 'Dignissimos neque blanditiis.'
                          status: closed
                          priority: low
                          createdAt: '2026-11-23T15:10:18.000000Z'
                          updatedAt: '2026-11-23T15:10:18.000000Z'
                        relationships:
                          author:
                            data:
                              type: user
                              id: 93
                            links:
                              self: 'http://localhost:8000/api/v1/authors/93'
                          assignee:
                            data: null
                        links:
                          self: 'http://localhost:8000/api/v1/tickets/146'
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: ticket
                        id:
                          type: integer
                          example: 145
                        attributes:
                          type: object
                          properties:
                            ticketNumber:
                              type: string
                              example: TCK-20261123-EIW6VH
                            title:
                              type: string
                              example: 'Adipisci quidem nostrum qui commodi.'
                            status:
                              type: string
                              example: resolved
                            priority:
                              type: string
                              example: high
                            createdAt:
                              type: string
                              example: '2026-11-23T15:10:18.000000Z'
                            updatedAt:
                              type: string
                              example: '2026-11-23T15:10:18.000000Z'
                        relationships:
                          type: object
                          properties:
                            author:
                              type: object
